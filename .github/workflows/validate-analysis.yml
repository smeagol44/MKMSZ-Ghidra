name: validate-analysis
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate analysis manifests
        run: python tools/validate_analysis.py
      - name: Syntax-check Wiki coverage audit
        run: python -m py_compile tools/audit_wiki_coverage.py
      - name: Verify known-knowledge inventory and code
        run: |
          python -m py_compile tools/report_known_knowledge.py
          python tools/report_known_knowledge.py
      - name: Validate stage resource file index
        run: |
          python -m py_compile tools/validate_stage_resource_files.py
          python tools/validate_stage_resource_files.py
      - name: Validate lifecycle knowledge contracts
        run: |
          python -m py_compile tools/validate_lifecycle_contracts.py
          python tools/validate_lifecycle_contracts.py
